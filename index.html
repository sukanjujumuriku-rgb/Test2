<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DFGHJK Rhythm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="lanes"></div>
    <div id="judgeLine"></div>

    <div id="start">
      <div class="start-title">DFGHJK</div>
      <button id="startButton">START</button>
    </div>

    <div id="result">
      <div id="resultTitle"></div>
      <div id="resultDetail"></div>
    </div>
  </div>

  <div id="hud">
    <span id="score">SCORE 000000</span>
    <span id="combo">COMBO 0</span>
    <span id="accuracy">100.00%</span>
  </div>

  <script src="game.js"></script>
</body>
</html>
